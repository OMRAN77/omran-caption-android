plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.omran.caption'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omran.caption'
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName '1.5.0'
        // Huawei phones are ARM; leaving out x86 keeps the speech detector's
        // native library from bloating the APK.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        // Fixed key kept in the repo: every CI build has the same signature, so
        // a new APK installs as an update over the old one (no uninstall). The
        // default debug key is random on each CI machine. Install only from
        // this repo's release link: anyone with this key could sign an "update".
        debug {
            storeFile file('omran-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Native libraries stored compressed: a smaller APK to download.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20240303'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Runs the Silero speech detector (assets/silero_vad.onnx) on the phone.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
